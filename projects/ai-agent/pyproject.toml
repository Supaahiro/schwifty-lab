[project]
name = "ai-agent"
version = "0.2.0"
description = "A ReAct + RAG AI agent powered by **GPT-4o-mini** and **ChromaDB** for internal knowledge retrieval from Markdown documents."
authors = [
    {name = "Hiro",email = "webmaster@supaahiro.org"}
]
license = {text = "**No-Commercial License** (see LICENSE file)"}
readme = "README.md"
requires-python = ">=3.13,<4.0.0"

[tool.poetry.dependencies]
python-dotenv = "^1.2.2"
langchain = "^1.3.14"
langchain-openai = "^1.6.0"
langchain-community = "^0.4.2"
langgraph = "^1.2.10"
langchain-chroma = "^1.1.0"
numexpr = "^2.14.2"
grandalf = "^0.8"
uv = "^0.12.10"
langgraph-checkpoint = "^4.2.0"
packaging = "^26.3"
langchain-huggingface = "^1.2.2"
sentence-transformers = "^6.0.1"
# torch is pulled in by sentence-transformers, but only ever runs the CPU
# embedding model (all-MiniLM-L6-v2). Taking it from PyPI drags in the whole
# CUDA stack -- 29 nvidia-* wheels, ~2.5 GB -- which times out in CI.
# Declared explicitly here purely to pin it to the CPU-only index.
# To run on GPU instead, see "Using a GPU build of torch" in README.md.
torch = { version = ">=2.7.1", source = "pytorch-cpu" }

# priority = "explicit" means nothing is taken from this index unless a
# dependency names it, so only torch is affected.
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^8.0.1"
pytest = "^9.1.1"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
