apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront
  namespace: gateway-store
spec:
  parentRefs:
    - name: edge
      namespace: gateway-infra
      sectionName: http
  hostnames: ["shop.gateway.test"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: store-v1
          port: 80
          weight: 80
        - name: store-v2
          port: 80
          weight: 20
