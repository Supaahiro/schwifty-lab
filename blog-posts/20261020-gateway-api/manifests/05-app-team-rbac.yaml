apiVersion: v1
kind: ServiceAccount
metadata:
  name: route-editor
  namespace: gateway-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: route-editor
  namespace: gateway-store
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: route-editor
  namespace: gateway-store
subjects:
  - kind: ServiceAccount
    name: route-editor
    namespace: gateway-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: route-editor
