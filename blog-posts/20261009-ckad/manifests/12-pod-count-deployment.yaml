# Run after scaling quota-workers to one replica: two Pods are already used.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: count-workers
  namespace: ckad-resource-policy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: count-workers
  template:
    metadata:
      labels:
        app: count-workers
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: busybox:1.37
          command: ["sh", "-c", "sleep 86400"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 16Mi
