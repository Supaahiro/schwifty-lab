# Only two of three replicas fit while the defaulted Pod consumes 100m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-workers
  namespace: ckad-resource-policy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quota-workers
  template:
    metadata:
      labels:
        app: quota-workers
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: busybox:1.37
          command: ["sh", "-c", "sleep 86400"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
