# First rejected by quota; admitted after the LimitRange supplies resources.
apiVersion: v1
kind: Pod
metadata:
  name: defaulted
  namespace: ckad-resource-policy
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
