# Intentionally rejected: the container CPU limit exceeds the 500m maximum.
apiVersion: v1
kind: Pod
metadata:
  name: over-limit-range
  namespace: ckad-resource-policy
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 750m
          memory: 128Mi
