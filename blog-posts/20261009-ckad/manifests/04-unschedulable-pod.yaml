# Intentionally Pending on the small lab cluster: 1000 CPU cores cannot fit.
apiVersion: v1
kind: Pod
metadata:
  name: too-large-to-schedule
  namespace: ckad-resources
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "1000"
          memory: 16Mi
        limits:
          cpu: "1000"
          memory: 32Mi
