apiVersion: v1
kind: Pod
metadata:
  name: cpu-burn
  namespace: ckad-resources
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "while true; do :; done"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
