apiVersion: v1
kind: Pod
metadata:
  name: invalid-budget
  namespace: ckad-requirements
spec:
  automountServiceAccountToken: false
  containers:
    - name: worker
      image: busybox:1.37.0
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 300m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 32Mi
