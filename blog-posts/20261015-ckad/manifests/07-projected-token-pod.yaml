apiVersion: v1
kind: Pod
metadata:
  name: projected-client
  namespace: ckad-serviceaccounts
spec:
  serviceAccountName: config-reader
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: api-credentials
          mountPath: /var/run/ckad-api
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: api-credentials
      projected:
        sources:
          - serviceAccountToken:
              # Omitted audience defaults to the API server audience.
              expirationSeconds: 600
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
