apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-reader
  namespace: ckad-serviceaccounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-reader
  template:
    metadata:
      labels:
        app: api-reader
    spec:
      serviceAccountName: config-reader
      # A Pod setting takes precedence over the ServiceAccount setting.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.12.1
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
