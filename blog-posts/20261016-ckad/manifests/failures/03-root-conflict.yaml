apiVersion: v1
kind: Pod
metadata:
  name: root-conflict
  namespace: ckad-security
spec:
  nodeSelector:
    kubernetes.io/os: linux
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "exec sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
