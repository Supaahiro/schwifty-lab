apiVersion: v1
kind: Pod
metadata:
  name: missing-key
  namespace: ckad-configmaps
spec:
  automountServiceAccountToken: false
  containers:
    - name: reader
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: REQUIRED_MODE
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: REQUIRED_MODE
