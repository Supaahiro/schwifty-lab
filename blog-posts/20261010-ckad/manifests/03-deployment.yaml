apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
  namespace: ckad-configmaps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: app-settings
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: app-settings
                  key: APP_MODE
            - name: LOG_LEVEL
              value: warning
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: config
              mountPath: /etc/app.properties
              subPath: settings/application.properties
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: app-files
            items:
              - key: application.properties
                path: settings/application.properties
