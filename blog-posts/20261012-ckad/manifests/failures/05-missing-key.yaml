# The Pod is accepted, but its container cannot start until API_TOKEN exists.
apiVersion: v1
kind: Pod
metadata:
  name: missing-key
  namespace: ckad-secrets
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep infinity"]
      env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-credentials
              key: API_TOKEN
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
