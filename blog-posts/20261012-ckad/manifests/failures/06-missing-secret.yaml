# The Pod is accepted, but its volume cannot mount until late-credentials exists.
apiVersion: v1
kind: Pod
metadata:
  name: missing-secret
  namespace: ckad-secrets
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep infinity"]
      volumeMounts:
        - name: credentials
          mountPath: /etc/late-credentials
          readOnly: true
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: credentials
      secret:
        secretName: late-credentials
        defaultMode: 0440
