apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-creator
  namespace: ckad-access
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-creator
  namespace: ckad-access
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: ckad-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-creator
