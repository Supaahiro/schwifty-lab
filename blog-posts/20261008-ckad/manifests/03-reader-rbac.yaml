apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: ckad-access
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: ckad-access
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: ckad-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
