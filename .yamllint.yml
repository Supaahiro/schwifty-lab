---
# yamllint configuration for schwifty-lab

extends: default

rules:
  line-length:
    max: 1024
    allow-non-breakable-inline-mappings: true
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

ignore: |
  .git/
  node_modules/
  vendor/
  _site/
  .jekyll-cache/
  scaffolding/
