version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    target-branch: "master"

  - package-ecosystem: pip
    directory: /projects/ai-agent
    schedule:
      interval: weekly
    target-branch: "master"

  - package-ecosystem: pip
    directory: /projects/pdns-admin-lite/backend
    schedule:
      interval: weekly
    target-branch: "master"

  - package-ecosystem: npm
    directory: /projects/pdns-admin-lite/frontend
    schedule:
      interval: weekly
    target-branch: "master"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: "master"
