# No major bumps for pip, npm and nuget: they arrive as a burst of PRs all touching
# the same lockfile (or Directory.Packages.props), so each merge invalidates the
# others, and a major needs a manual read of the changelog regardless. Majors are
# bumped by hand, one project at a time. Deliberately a single "*" rule per entry
# rather than per-package ones.
# github-actions is exempt: it is grouped into one PR, so it never conflicts.
#
# Note the plural `directories`: it lets one entry (and so one ignore rule) cover
# every project of an ecosystem. `directory: /` would NOT work here -- it does not
# recurse, and the repo root holds no pip or nuget manifest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    target-branch: "master"

  - package-ecosystem: pip
    directories:
      - /projects/ai-agent
      - /projects/pdns-admin-lite/backend
    schedule:
      interval: weekly
    target-branch: "master"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directories:
      - /projects/api-resilience
    schedule:
      interval: weekly
    target-branch: "master"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories:
      - /
      - /projects/pdns-admin-lite/frontend
    schedule:
      interval: weekly
    target-branch: "master"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
