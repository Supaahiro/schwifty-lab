name: pr-validate-ai-agent

on:
  # Manual runs: these validations have no other on-demand trigger.
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'projects/ai-agent/**'
      - '.github/workflows/pr-validate-ai-agent.yml'
  pull_request:
    paths:
      - 'projects/ai-agent/**'
      - '.github/workflows/pr-validate-ai-agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-agent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest -v
